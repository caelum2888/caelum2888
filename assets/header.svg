<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="CAELUM Systems — Vitor Scheitel. Engineering systems in a Stark inspired HUD">
<defs>
 <linearGradient id="b" x2="1" y2="1"><stop stop-color="#0C1521"/><stop offset="1" stop-color="#070A10"/></linearGradient>
 <linearGradient id="a"><stop stop-color="#EE424A"/><stop offset=".6" stop-color="#EE424A"/><stop offset="1" stop-color="#61DDFF"/></linearGradient>
 <filter id="gl"><feGaussianBlur stdDeviation="7"/></filter>
 <style>
 text{font-family:ui-monospace,Menlo,Consolas,monospace}
 .pulse{animation:p 4s ease-in-out infinite;transform-origin:930px 230px}.rot{animation:r 35s linear infinite;transform-origin:930px 230px}
 @keyframes p{50%{opacity:.45}}@keyframes r{to{transform:rotate(360deg)}}
 @media(prefers-reduced-motion:reduce){.pulse,.rot{animation:none}}
 </style>
</defs>
<rect width="1200" height="460" rx="22" fill="url(#b)"/>
<rect x="1" y="1" width="1198" height="458" rx="21" stroke="#263749" stroke-width="2"/>
<path d="M0 56H1200 M0 408H1200" stroke="#263749"/>
<circle cx="33" cy="28" r="5" fill="#EA555C"/><circle cx="52" cy="28" r="5" fill="#E9B45C"/><circle cx="71" cy="28" r="5" fill="#50D9F5"/>
<text x="102" y="34" font-size="14" fill="#8B9CB0" letter-spacing="2">CAELUM // SYSTEMS</text><text x="1160" y="34" font-size="13" fill="#50D9F5" text-anchor="end">PERSONAL ENGINEERING CONSOLE</text>
<g opacity=".16" stroke="#50D9F5" stroke-width="1">
 <path d="M35 90H770 M35 140H770 M35 190H770 M35 240H770 M35 290H770 M35 340H770 M35 390H770"/>
 <path d="M120 70V400 M220 70V400 M320 70V400 M420 70V400 M520 70V400 M620 70V400 M720 70V400"/>
</g>
<rect x="42" y="93" width="7" height="170" rx="3" fill="#EE424A"/>
<text x="70" y="127" fill="#50D9F5" font-size="16" letter-spacing="4">IDENTITY // 001</text>
<text x="70" y="196" fill="#F2F6FB" font-size="54" font-weight="bold">VITOR SCHEITEL</text>
<text x="70" y="241" fill="#B8C6D8" font-size="19">BACKEND / AUTOMATION / AI SYSTEMS</text>
<text x="70" y="272" fill="#B8C6D8" font-size="19">DEFENSIVE SECURITY // LEARNING</text>
<path d="M70 297H720" stroke="url(#a)" stroke-width="2"/>
<text x="70" y="329" fill="#7890A8" font-size="14">MISSION</text>
<text x="70" y="356" fill="#E1E9F3" font-size="17">Build useful systems. Keep humans in control.</text>
<text x="70" y="386" fill="#50D9F5" font-size="15">● OPEN TO INTERNSHIPS</text>
<g transform="translate(930 230)">
 <circle r="153" stroke="#4E687C" stroke-width="1" stroke-dasharray="3 16"/>
 <circle r="132" stroke="#50D9F5" stroke-opacity=".2" stroke-width="1"/>
 <g class="rot"><circle r="118" stroke="#EE424A" stroke-width="4" stroke-dasharray="170 28 70 20 200 60"/><circle r="105" stroke="#50D9F5" stroke-opacity=".5" stroke-width="2" stroke-dasharray="45 16"/></g>
 <circle r="84" fill="#0B1823" stroke="#50D9F5" stroke-width="3"/>
 <circle r="68" fill="#0B121C" stroke="#EE424A" stroke-width="7"/>
 <g class="pulse"><circle r="50" fill="#50D9F5" opacity=".17" filter="url(#gl)"/><circle r="43" fill="#0C2C3B" stroke="#8FECFF" stroke-width="4"/></g>
 <path d="M0-34L30 17H-30Z" stroke="#EE424A" stroke-width="4" fill="none" stroke-linejoin="round"/>
 <circle r="9" fill="#D9F9FF"/>
</g>
<text x="930" y="406" fill="#7890A8" text-anchor="middle" font-size="12" letter-spacing="2">CORE // ONLINE</text>
<text x="42" y="436" fill="#7890A8" font-size="13">caelum2888.dev // BUILD · TEST · REVIEW · ITERATE</text>
<text x="1158" y="436" fill="#EE424A" text-anchor="end" font-size="13">SYSTEM STATUS: BUILDING</text>
</svg>